<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ambio Campaign Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.38.4/js/msal-browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #061614; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    #_loading { color:#4a9eff; font-family:sans-serif; padding:40px; text-align:center; }
  </style>
</head>
<body>
  <div id="_loading">Loading Ambio Tracker...</div>
  <div id="root"></div>
  <script>
    fetch('./Ambio_Tracker.jsx')
      .then(function(r) { return r.text(); })
      .then(function(src) {
        src = src.replace(
          /^import React,\s*\{([^}]+)\}\s*from\s*['"]react['"];?\r?\n?/m,
          function(_, names) { return 'var {' + names + '} = React;\n'; }
        );
        src = src.replace(
          /^import\s+ReactDOM\s+from\s*['"]react-dom['"];?[^\n]*\r?\n?/m,
          ''
        );
        src = src.replace(/^export default function App\(\)/m, 'function App()');

        var result = Babel.transform(src, {
          presets: [['react', { runtime: 'classic' }]],
          filename: 'Ambio_Tracker.jsx'
        });

        // eslint-disable-next-line no-eval
        eval(result.code);

        document.getElementById('_loading').remove();
        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(window.App));
      })
      .catch(function(err) {
        document.getElementById('_loading').textContent = 'Error: ' + err.message;
        console.error(err);
      });
  </script>
</body>
</html>
